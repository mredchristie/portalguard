<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PortalGuard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The window's title bar: macOS draws the close and minimise buttons in
         it, and dragging it moves the window. -->
    <div class="titlebar" aria-hidden="true"></div>
    <div class="orb orb--green" aria-hidden="true"></div>
    <div class="orb orb--blue" aria-hidden="true"></div>

    <main class="app" data-phase="idle">
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5 4.5 5.4v6.1c0 4.8 3.2 8.4 7.5 10 4.3-1.6 7.5-5.2 7.5-10V5.4z" />
            <path class="mark-tick" d="m8.6 12.2 2.4 2.4 4.6-4.9" />
          </svg>
          <span class="name">PortalGuard</span>
        </div>
        <span class="pill" data-pill>Ready</span>
      </header>

      <section class="hero" aria-live="polite">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#00ff88" />
                <stop offset="100%" stop-color="#0099ff" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="60" cy="60" r="52" />
            <circle class="ring-arc" cx="60" cy="60" r="52" />
          </svg>
          <div class="ring-core">
            <svg class="glyph" viewBox="0 0 24 24" data-glyph></svg>
          </div>
        </div>
        <h1 class="headline" data-headline>Ready when you are</h1>
        <p class="sub" data-sub>Arm before you join public Wi-Fi. Nothing on this Mac can reach the network until you have signed in and your VPN is up.</p>
      </section>

      <section class="context" data-context></section>

      <ol class="steps" data-steps aria-label="Progress">
        <li data-step="armed"><i></i><span>Armed</span></li>
        <li data-step="network"><i></i><span>Network</span></li>
        <li data-step="login"><i></i><span>Sign in</span></li>
        <li data-step="sealed"><i></i><span>Sealed</span></li>
        <li data-step="vpn"><i></i><span>VPN</span></li>
      </ol>

      <footer class="actions">
        <button class="btn btn--primary" data-primary>Arm</button>
        <p class="hint" data-hint>You will be asked for your Mac password.</p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
